<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var isExt = function (val) {
          return (
            typeof val === 'string' &&
            (val.indexOf('chrome-extension://') !== -1 ||
              val.indexOf('moz-extension://') !== -1 ||
              val.indexOf('safari-extension://') !== -1 ||
              val.indexOf('safari-web-extension://') !== -1)
          );
        };
        window.addEventListener(
          'error',
          function (e) {
            if (isExt(e.filename) || isExt(e.error && e.error.stack)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var stack = e.reason && e.reason.stack;
            var msg = e.reason && e.reason.message;
            if (isExt(stack) || isExt(msg)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.configurable && typeof desc.get === 'function' && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: desc.get,
              set: function () {},
              enumerable: desc.enumerable,
              configurable: true,
            });
          }
        } catch (_err) {
          // Ignore if window.fetch descriptor cannot be updated
        }
      })();
    </script>
